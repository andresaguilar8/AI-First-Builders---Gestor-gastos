services:
  db:
    image: postgres:16
    container_name: gestor-gastos-db
    environment:
      POSTGRES_DB: gestor_gastos
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestor_gastos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
